<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Umbanda - Edição Sagrada</title>
    <!-- Biblioteca de Confetes -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --primary: #2c3e50; 
            --accent: #d35400; 
            --correct: #27ae60; 
            --wrong: #c0392b;
            --gold: #f39c12;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #1b2735 0%, #2c3e50 50%, #4a235a 100%);
            min-height: 100vh;
            display: flex; 
            justify-content: center; 
            align-items: center;
            padding: 20px; 
            margin: 0; 
        }
        #quiz-container { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); 
            width: 100%; 
            max-width: 650px; 
            border-top: 8px solid var(--gold);
            backdrop-filter: blur(10px);
            position: relative;
        }
        h1 { 
            color: var(--primary); 
            text-align: center; 
            margin-top: 0; 
            font-size: 1.8em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        h2 { color: var(--primary); text-align: center; }
        
        #stats-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-weight: bold; 
            margin-bottom: 15px; 
            font-size: 1em; 
            color: var(--primary);
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
        }
        #timer { color: #c0392b; font-size: 1.1em; }
        #streak { color: var(--gold); }

        #question { 
            font-size: 1.2em; 
            margin-bottom: 20px; 
            line-height: 1.4; 
            color: #2c3e50; 
            font-weight: 600;
        }
        .option { 
            display: block; 
            width: 100%; 
            padding: 14px; 
            margin: 10px 0; 
            border: 2px solid #e0e0e0; 
            cursor: pointer; 
            border-radius: 8px; 
            background: white; 
            transition: all 0.2s ease; 
            font-size: 1em; 
            text-align: left; 
            font-weight: 500;
        }
        .option:hover:not(:disabled) { 
            background: #fdf3e7; 
            border-color: var(--accent); 
            transform: translateY(-2px);
        }
        .option:disabled { cursor: default; }
        .correct { background-color: var(--correct) !important; color: white; border-color: var(--correct) !important; animation: pulse 0.4s; }
        .wrong { background-color: var(--wrong) !important; color: white; border-color: var(--wrong) !important; }
        
        .block-btn { 
            background: linear-gradient(135deg, var(--primary), #34495e); 
            color: white; 
            font-weight: bold; 
            margin: 10px 0; 
            border: none; 
            text-align: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .block-btn:hover { background: linear-gradient(135deg, #34495e, var(--accent)); }
        
        /* Estilo Analógico do Velocímetro com Ponteiro */
        .gauge-container { 
            position: relative; 
            width: 140px; 
            height: 70px; 
            margin: 0 auto 20px auto; 
            overflow: hidden; 
            text-align: center; 
        }
        .gauge-body { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 140px; 
            height: 70px; 
            border-radius: 70px 70px 0 0; 
            background: #e0e0e0; 
            overflow: hidden; 
        }
        .gauge-fill { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 140px; 
            height: 70px; 
            border-radius: 70px 70px 0 0; 
            background: linear-gradient(90deg, #e74c3c, #f39c12, #27ae60); 
            transform-origin: center bottom; 
            transform: rotate(0deg); 
            transition: transform 0.6s cubic-bezier(0.4, 2.08, 0.55, 0.44); 
        }
        .gauge-cover { 
            position: absolute; 
            bottom: 0; 
            left: 15px; 
            width: 110px; 
            height: 55px; 
            border-radius: 55px 55px 0 0; 
            background: white; 
            display: flex; 
            align-items: flex-end; 
            justify-content: center; 
            font-size: 1.1em; 
            font-weight: bold; 
            color: var(--primary); 
            padding-bottom: 2px;
        }
        /* O Ponteiro Físico */
        .gauge-needle {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 4px;
            height: 60px;
            background: var(--primary);
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(-90deg); /* Começa no 0% (esquerda) */
            transition: transform 0.6s cubic-bezier(0.4, 2.08, 0.55, 0.44);
            border-radius: 4px 4px 0 0;
            z-index: 5;
        }
        .gauge-center-pin {
            position: absolute;
            bottom: -6px;
            left: 50%;
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
            transform: translateX(-50%);
            z-index: 6;
        }

        #quiz-screen, #result-screen { display: none; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div id="quiz-container">
    <h1>🕊️ Quiz Sagrado de Umbanda ✨</h1>
    
    <!-- Tela de Seleção de Blocos -->
    <div id="menu-screen">
        <h2>Escolha um Bloco de Sabedoria (10 Questões):</h2>
        <div id="blocks-list"></div>
    </div>

    <!-- Tela do Quiz -->
    <div id="quiz-screen">
        <!-- Velocímetro com Ponteiro Real -->
        <div class="gauge-container" title="Desempenho Atual">
            <div class="gauge-body">
                <div class="gauge-fill" id="gauge-fill"></div>
            </div>
            <div class="gauge-needle" id="gauge-needle"></div>
            <div class="gauge-center-pin"></div>
            <div class="gauge-cover" id="gauge-text">0%</div>
        </div>

        <div id="stats-bar">
            <span id="score-display">⭐ Pontos: 0</span>
            <span id="streak">🔥 Sequência: 0</span>
            <span id="timer">⏱️ 10s</span>
        </div>
        <div id="question">Carregando...</div>
        <div id="options"></div>
    </div>

    <!-- Tela de Resultado Final -->
    <div id="result-screen" style="text-align: center;">
        <h2>🎉 Bloco Finalizado! 🎉</h2>
        <p id="final-score" style="font-size: 1.2em; font-weight: bold; color: var(--primary);"></p>
        <p id="feedback-msg" style="font-size: 1.1em; color: #555; margin-bottom: 20px;"></p>
        <button class="option block-btn" onclick="location.reload()">🔄 Escolher Outro Bloco</button>
    </div>
</div>

<script>

        {q: "Como a Umbanda enxerga a figura de Jesus Cristo?", a: ["Apenas como um líder político histórico", "Como uma entidade de esquerda", "Como o Maior Guia da Humanidade, associado a Oxalá", "Como um profeta menor"], c: 2},

        {q: "O sincretismo religioso na Umbanda surgiu historicamente devido a quê?", a: ["À proibição e perseguição às religiões de matriz africana", "Ao fato de os Orixás serem santos católicos", "À imposição do espiritismo kardecista", "A uma exigência do governo imperial"], c: 0},

    [
        {q: "Na teologia de Umbanda, como os Orixás são primariamente compreendidos?", a: ["Deuses gregos", "Irradiações divinas de Deus e da natureza", "Espíritos comuns", "Anjos caídos"], c: 1},

        {q: "Qual Orixá é a Grande Mãe, rainha dos mares?", a: ["Oxum", "Nanã", "Iansã", "Iemanjá"], c: 3},
        {q: "Saudação de Iemanjá?", a: ["Odoyá!", "Eparrei", "Kaô", "Atotô"], c: 0}

    [

        {q: "Característica dos Pretos Velhos?", a: ["Agitação", "Armas de fogo", "Serenidade e sabedoria", "Cobrança"], c: 2},
        {q: "O que representam os Erês?", a: ["Espíritos zombeteiros", "Energia da alegria e pureza", "Entidades maldosas", "Larvas astrais"], c: 1},
        {q: "Saudação dos Pretos Velhos?", a: ["Laroyê", "Saravá!", "Okê", "Eparrei"], c: 1},
        {q: "Bebida associada aos Pretos Velhos?", a: ["Refrigerantes", "Café", "Cerveja preta", "Champanhe"], c: 1},
        {q: "Elementos associados aos Erês?", a: ["Charutos", "Doces e guaraná", "Velas pretas", "Sal grosso"], c: 1},
        {q: "Como Caboclos atuam nos passes?", a: ["Cirurgias plásticas", "Tarô", "Ervas e passes magnéticos", "Apenas pontos cantados"], c: 2},
        {q: "Origem histórica dos Pretos Velhos?", a: ["Reis europeus", "Cientistas", "Escravizados africanos", "Sacerdotes maias"], c: 2},
        {q: "Por que Pretos Velhos atendem sentados?", a: ["Falta de educação", "Viagem astral", "Evitar o futuro", "Simbolismo de humildade e cansaço"], c: 3},
        {q: "Saudação típica dos Caboclos?", a: ["Salve as Almas", "Okê, Caboclo!", "Laroyê", "Atotô"], c: 1}
    ],
    // Bloco 6: Linhas de Trabalho - Baianos, Boiadeiros, Marinheiros e Malandros
    [

    [
        {q: "Função da Defumação?", a: ["Purificar ambientes", "Aromatizar", "Afugentar Orixás", "Limpeza física"], c: 0},
        {q: "Banhos de ervas?", a: ["Cura instantânea", "Limpar campo áurico", "Ganho na loteria", "Fechar corpo"], c: 1},

        {q: "Roupa branca?", a: ["Absorver pecados", "Moda", "Uniforme", "Pureza e neutralidade"], c: 3},
        {q: "Bater Cabeça?", a: ["Punição", "Respeito e humildade", "Meditação", "Cumprimento"], c: 1},

    ]

let blocoAtual = [];
let currentQ = 0, score = 0, streak = 0, timeLeft = 10, timer;

const blocksList = document.getElementById('blocks-list');
const nomesBlocos = [
    "🌿 Bloco 1: História e Fundamentos",
    "🕊️ Bloco 2: Orixás - Fé e Amor",
    "⚖️ Bloco 3: Orixás - Conhecimento, Justiça e Lei",
    "🌊 Bloco 4: Orixás - Evolução e Transmutação",
    "🚬 Bloco 5: Linhas de Trabalho - Pretos Velhos, Caboclos e Erês",
    "🤠 Bloco 6: Linhas de Trabalho - Baianos, Boiadeiros e Malandros",
    "🔱 Bloco 7: Linha da Esquerda",
    "🕯️ Bloco 8: Rituais, Ervas e Organização"
];

nomesBlocos.forEach((nome, index) => {
    const btn = document.createElement('button');
    btn.className = 'option block-btn';
    btn.innerText = nome;
    btn.onclick = () => iniciarBloco(index);
    blocksList.appendChild(btn);
});

function iniciarBloco(index) {
    blocoAtual = blocosDePerguntas[index];
    currentQ = 0;
    score = 0;
    streak = 0;
    atualizarVelocimetro();
    document.getElementById('menu-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    loadQuestion();
}

function atualizarVelocimetro() {
    let totalRespondidas = currentQ;
    let porcentagem = totalRespondidas === 0 ? 0 : (score / totalRespondidas) * 100;
    
    // Converte a porcentagem (0 a 100) para graus do ponteiro (-90° a +90°)
    const grausPonteiro = -90 + (porcentagem / 100) * 180;
    
    // Atualiza a barra de preenchimento e a rotação do ponteiro
    document.getElementById('gauge-fill').style.transform = `rotate(${(porcentagem / 100) * 180}deg)`;
    document.getElementById('gauge-needle').style.transform = `translateX(-50%) rotate(${grausPonteiro}deg)`;
    document.getElementById('gauge-text').innerText = Math.round(porcentagem) + "%";
}

function loadQuestion() {
    clearInterval(timer);
    if(currentQ >= blocoAtual.length) {
        finalizarQuiz();
        return;
    }
    
    timeLeft = 20;
    document.getElementById('timer').innerText = "⏱️ " + timeLeft + "s";
    
    const data = blocoAtual[currentQ];
    document.getElementById('question').innerText = (currentQ + 1) + ". " + data.q;
    const opts = document.getElementById('options');
    opts.innerHTML = '';
    
    data.a.forEach((txt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.innerText = txt;
        btn.onclick = () => check(i, btn);
        opts.appendChild(btn);
    });

    timer = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = "⏱️ " + timeLeft + "s";
        if(timeLeft <= 0) check(-1, null);
    }, 1000);
}

function check(idx, selectedBtn) {
    clearInterval(timer);
    const data = blocoAtual[currentQ];
    const opts = document.getElementById('options').children;

    for (let btn of opts) {
        btn.disabled = true;
    }

    if (idx === data.c) {
        score++;
        streak++;
        if (selectedBtn) selectedBtn.classList.add('correct');
    } else {
        streak = 0;
        if (selectedBtn) selectedBtn.classList.add('wrong');
        opts[data.c].classList.add('correct');
    }

    document.getElementById('score-display').innerText = "⭐ Pontos: " + score;
    document.getElementById('streak').innerText = "🔥 Sequência: " + streak;
    
    currentQ++;
    atualizarVelocimetro();

    setTimeout(() => {
        loadQuestion();
    }, 1200);
}

function finalizarQuiz() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    
    const porcentagemFinal = (score / blocoAtual.length) * 100;
    document.getElementById('final-score').innerText = `Você acertou ${score} de ${blocoAtual.length} questões (${Math.round(porcentagemFinal)}% de aproveitamento)!`;
    
    let mensagem = "";
    if (porcentagemFinal === 100) {
        mensagem = "Axé total! Gabarito perfeito, muita luz e conhecimento espiritual! ✨🕊️";
    } else if (porcentagemFinal >= 70) {
        mensagem = "Excelente! Você tem uma ótima bagagem sobre os mistérios da Umbanda! 🌿🔥";
    } else if (porcentagemFinal >= 40) {
        mensagem = "Bom esforço! Continue estudando e firme na caridade. 🙏✨";
    } else {
        mensagem = "Não desanime! O aprendizado na Umbanda é um caminho contínuo de evolução. 🌟";
    }
    document.getElementById('feedback-msg').innerText = mensagem;
    
    if (porcentagemFinal >= 50) {
        confetti({
            particleCount: 150,
            spread: 90,
            origin: { y: 0.6 }
        });
    }
}
</script>
